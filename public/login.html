<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/alerta.js"></script>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="pagina">
        <div class="titulo">
            <img src="./img/logo.png" alt="">
            <span>SIGNAL</span>
        </div>
        <div class="sub">
            <h2>Bem-vindo de volta</h2>
            <span>Insira suas credenciais para gerenciar seus dados cinematográficos</span>
        </div>
        <div class="campos">
            <span>E-MAIL</span>
            <input type="text" id="email_input" placeholder="✉ produtor@estudio.com">
            <span>SENHA</span>
            <input type="password" id="senha_input" placeholder="🔒︎ ●●●●●●●●">
            <button onclick="entrar()">Entrar na Plataforma ➝</button>

            <span>Novo na Signal? <a href="./index.html#p">ASSINAR</a></span>
        </div>
        <div class="login">
        <span> <a href="./acessoEmpresa.html" id="linkAdmin">Acesso Administrador</a></span>
      </div>
       
    </div>
    
<div id="modalSenha" class="modal">
    <div class="modal-conteudo">
        <h3>Acesso Administrador</h3>
        <input type="password" id="campoSenha" placeholder="Digite a senha" />
        <p id="erroSenha" class="erro"></p>
        <div class="botoes">
            <button id="btnEntrar">Entrar</button>
            <button id="btnCancelar">Cancelar</button>
        </div>
    </div>
</div>

</body>

</html>

<script>


    const linkAdmin = document.getElementById("linkAdmin");
    const modal = document.getElementById("modalSenha");
    const campoSenha = document.getElementById("campoSenha");
    const erroSenha = document.getElementById("erroSenha");
    const btnEntrar = document.getElementById("btnEntrar");
    const btnCancelar = document.getElementById("btnCancelar");

    function validarSenha() {
      fetch("/administrador/autenticar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ senha: campoSenha.value }),
      })
        .then(function (resposta) {
          if (resposta.ok) {
            window.location.href = "./acessoEmpresa.html";
          } else {
            erroSenha.textContent = "Senha incorreta!";
            campoSenha.value = "";
            campoSenha.focus();
          }
        })
        .catch(function (erro) {
          console.log(`#ERRO: ${erro}`);
          erroSenha.textContent = "Erro ao conectar com o servidor.";
        });
    }

    function abrirModal() {
      modal.classList.add("aberto");
      campoSenha.value = "";
      erroSenha.textContent = "";
      campoSenha.focus();
    }

    function fecharModal() {
      modal.classList.remove("aberto");
    }

    linkAdmin.addEventListener("click", function (e) {
      e.preventDefault();
      abrirModal();
    });

    btnEntrar.addEventListener("click", validarSenha);
    btnCancelar.addEventListener("click", fecharModal);

    campoSenha.addEventListener("keydown", function (e) {
      if (e.key === "Enter") validarSenha();
      if (e.key === "Escape") fecharModal();
    });

    modal.addEventListener("click", function (e) {
      if (e.target === modal) fecharModal();
    });



  function entrar() {
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (emailVar == "" || senhaVar == "") {
        alert("Preencha todos os campos!");
        return;
    }

    console.log("FORM LOGIN:", emailVar);

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    })
    .then(function (resposta) {

        if (resposta.ok) {
            return resposta.json();

        } else {
            throw new Error("E-mail ou senha inválidos!");
        }

    })
    .then(function (json) {

        console.log("Usuário autenticado:", json);

        var usuario = json[0];

        sessionStorage.setItem("ID_USUARIO", usuario.idUsuario);
        sessionStorage.setItem("FK_EMPRESA", usuario.fkEmpresa);
        sessionStorage.setItem("NOME_USUARIO", usuario.nome);
        sessionStorage.setItem("EMAIL_USUARIO", usuario.email);

        console.log("ID salvo:", sessionStorage.getItem("ID_USUARIO"));

        window.location.href = "/dash.html";

    })
    .catch(function (erro) {
        console.log("Erro no login:", erro);
        alert(erro.message);
    });

    return false;
}

</script>
