<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/alerta.js"></script>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="pagina">
        <div class="titulo">
            <img src="./img/logo.png" alt="">
            <span>SIGNAL</span>
        </div>
        <div class="sub">
            <h2>Bem-vindo de volta</h2>
            <span>Insira suas credenciais para gerenciar seus dados cinematográficos</span>
        </div>
        <div class="campos">
            <span>E-MAIL</span>
            <input type="text" id="i_email" placeholder="✉ produtor@estudio.com">
            <span>SENHA</span>
            <input type="password" id="i_senha" placeholder="🔒︎ ●●●●●●●●">
            <button onclick="entrar()">Entrar na Plataforma ➝</button>

            <span>Novo na Signal? <a href="./index.html#p">ASSINAR</a></span>
        </div>
       
    </div>
    


</body>

</html>

<script>


    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            console.log("Campos vazios");
        } else {
            console.log("FORM LOGIN: ", emailVar);
            console.log("FORM SENHA: ", senhaVar);

        }


        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);
                window.location = "/dashboard/dashboard.html";
                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }



</script>
