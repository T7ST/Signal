<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/alerta.js"></script>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="pagina">
        <div class="caixa1">
            <div class="titulo">
                <h1>SIGNAL</h1>
            </div>
            <div class="subtitulo">
                <h3>Faça login no site!</h3>
            </div>


            <div class="campos">
                <span>Email do Usuário:</span> <br>
                <input type="text" id="email_input"><br>

                <span>Senha:</span> <br>
                <input type="text" id="senha_input"><br>
            </div>

            <div class="botaoCadastro">
                <button onclick="entrar()">Logar-se →</button>
            </div>

            <div class="botaoLogin">
                <span>Não possui conta ainda? <a href="cadastro.html">Cadastrar</a></span>
            </div>
        </div>
    </div>


</body>

</html>

<script>


    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            console.log("Campos vazios");
        } else{
            console.log("FORM LOGIN: ", emailVar);
            console.log("FORM SENHA: ", senhaVar);

        }


        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);
                window.location = "/dashboard/dashboard.html";
                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }



</script>
