<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../css/pagamento.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="cabecalho">
        <div class="foto">
            <img src="../img/logo.png" alt="">
        </div>
        <div class="titulo">
            <h3>Signal</h3>
            <span>ASSINATURA PAGAMENTO</span>
        </div>
    </div>

    <div class="corpo">
        <div class="t2">
            <span>1 </span> <span>Pagamento Seguro</span>
        </div>

        <div class="plano">
            <div class="t3">
                <span>Signal Pro <span id="nomePlano"></span></span>
            </div>
            <div class="sub">
                <span>Acesso executivo para estúdios e analistas independentes</span>
            </div>
            <div class="preco">
                <span>TOTAL PAGAMENTO</span> <br>
                <span id="precoPlano"></span>
            </div>
        </div>

        <div class="formas">
            <div class="t4">
                <span>FORMAS DE PAGAMENTO</span>
            </div>
            <div class="opcao">
                <div class="o1" onclick="selecionarFormaPagamento('cartao')">
                    <div class="cartao">
                        <img src="../img/cartao.png" alt="">
                    </div>
                    <div class="desc">
                        <span>Cartão</span>
                    </div>
                </div>

                <div class="o2" onclick="selecionarFormaPagamento('pix')">
                    <div class="cartao">
                        <img src="../img/qr.png" alt="">
                    </div>
                    <div class="desc">
                        <span>Pix</span>
                    </div>
                </div>
            </div>
        </div>


        <div class="campos" id="camposCartao">
            <span>Número do Cartão <span id="mensagemnumero"></span> </span> 
            <input type="text" id="input_numero" placeholder="0000 0000 0000 0000">
            <span>Nome impresso no Cartão <span id="mensagemnome"></span> </span> 
            <input type="text" id="input_nome" placeholder="COMO IMPRESSO NO CARTÃO">
            <div class="campo2">
                <div class="p1">
                     <span>Validade <span id="mensagemvalidade"></span> </span> <br>
                <input type="text" id="input_validade" placeholder="MM/AA">
                </div>
               <div class="p2">
                <span>CVV <span id="mensagemCVV"></span> </span> <br>
                <input type="text" id="input_CVV" placeholder="123">
               </div>
                
            </div>

            <div id="blocoParcelamento">
                <span>Parcelamento</span> <br>
                <select id="input_parcelamento">
                    <option value="12">12x de 49,90 sem acréscimo</option>
                    <option value="6">6x de 84,00 sem acréscimo</option>
                </select>
            </div>
        </div>


        <div class="campos" id="camposPix" style="display: none;">
            <div style="text-align: center;">
                <span>Escaneie o QR Code para pagar via Pix</span> <br><br>
                <img id="qrCodePix" src="" alt="QR Code Pix" style="width: 200px; height: 200px;">
                <br><br>
                <span id="mensagemPix" style="font-size: 0.9em; color: #ababab;"></span>
            </div>
        </div>

        <div class="botao">
            <button onclick="confirmar()">CONFIRMAR PAGAMENTO E CRIAR CONTA</button>
        </div>
</body>

</html>
<script>
    let validaçãoS = ``;
    let mensagem = ``;
    const params = new URLSearchParams(window.location.search);
    const planoDaURL = params.get('plano');
    const planoSalvo = localStorage.getItem('planoEscolhido');
    const plano = planoDaURL || planoSalvo || 'padrao';
    if (planoDaURL) localStorage.setItem('planoEscolhido', planoDaURL);
    const planos = {
        mensal: { nome: 'Mensal', preco: 'R$ 49,90/mês' },
        anual: { nome: 'Anual', preco: 'R$ 499,90/ano' },
        padrao: { nome: 'Plano não selecionado', preco: '' }
    };

    const infoPlano = planos[plano] || planos.padrao;
    document.getElementById('nomePlano').textContent = infoPlano.nome;
    document.getElementById('precoPlano').textContent = infoPlano.preco;

    if (plano !== 'anual') {
        document.getElementById('blocoParcelamento').style.display = 'none';
    }
    // ==========================================================================
    function selecionarFormaPagamento(forma) {
        const camposCartao = document.getElementById('camposCartao');
        const camposPix = document.getElementById('camposPix');
        const o1 = document.querySelector('.o1');
        const o2 = document.querySelector('.o2');

        if (forma === 'cartao') {
            camposCartao.style.display = 'block';
            camposPix.style.display = 'none';


            o1.classList.add('selecionado');
            o2.classList.remove('selecionado');

        } else if (forma === 'pix') {
            camposCartao.style.display = 'none';
            camposPix.style.display = 'block';

            o2.classList.add('selecionado');
            o1.classList.remove('selecionado');


            document.getElementById('qrCodePix').src =
                'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=pagamento-exemplo';
            document.getElementById('mensagemPix').textContent =
                'Código expira em 15 minutos';
        }

    }
</script>
