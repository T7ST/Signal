<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/administrador.css">
    <title>Document</title>
</head>

<body>
    <div class="voltar">
        <a href="./acessoEmpresa.html">↩</a>
    </div>

    <div class="corpo1">
        <div class="plano">
            <span>🔴</span>
            <span>Acesso Privado</span>
        </div>
        <div class="titulo">
            <h1>Cadastre Empresas</h1>
        </div>
        <div class="sub">
            Configure empresas parceiras para acessarem a aplicação
        </div>

        <div class="campos">
            <h2 class="secao">DADOS DA EMPRESA</h2>
            <label for="input_nome">CÓDIGO EMPRESA <span id="mensagemcodigo"></span></label>
            <input type="text" id="input_codigo" maxlength="15" placeholder="~~~~~~~~" />
            <label for="input_nome">RAZÃO SOCIAL <span id="mensagemnome"></span></label>
            <input type="text" id="input_nome" placeholder="LTDA / S.A" />
            <label for="input_cnpj">CNPJ <span id="mensagemcnpj"></span></label>
            <input type="text" id="input_cnpj" oninput="mascaraCnpj()" maxlength="18" inputmode="numeric"
                placeholder="00.000.000/0000-00" />
            <h2 class="secao">ENDEREÇO DA EMPRESA</h2>

            <div class="linha">
                <div class="coluna pequena">
                    <label for="input_cep">CEP <span id="mensagemcep"></span></label>
                    <input type="text" id="input_cep" inputmode="numeric" placeholder="00000-000" maxlength="9"
                        oninput="mascaraCep()" />
                </div>
                <div class="coluna grande">
                    <label for="input_cidade">CIDADE <span id="mensagemcidade"></span></label>
                    <input type="text" id="input_cidade" placeholder="Ex: São Paulo" />
                </div>
                <div class="coluna grande">
                    <label for="input_rua">LOGRADOURO <span id="mensagemrua"></span></label>
                    <input type="text" id="input_rua" placeholder="Ex: Av. Paulista" />
                </div>
                <div class="coluna pequena">
                    <label for="input_numero">NÚMERO <span id="mensagemnumero"></span></label>
                    <input type="text" id="input_numero" inputmode="numeric" placeholder="1000" />
                </div>

                <div class="coluna pequena">
                    <label for="input_estado">ESTADO <span id="mensagemestado"></span></label>
                    <select id="input_estado">
                        <option value="">UF</option>
                        <option>AC</option>
                        <option>AL</option>
                        <option>AP</option>
                        <option>AM</option>
                        <option>BA</option>
                        <option>CE</option>
                        <option>DF</option>
                        <option>ES</option>
                        <option>GO</option>
                        <option>MA</option>
                        <option>MT</option>
                        <option>MS</option>
                        <option>MG</option>
                        <option>PA</option>
                        <option>PB</option>
                        <option>PR</option>
                        <option>PE</option>
                        <option>PI</option>
                        <option>RJ</option>
                        <option>RN</option>
                        <option>RS</option>
                        <option>RO</option>
                        <option>RR</option>
                        <option>SC</option>
                        <option>SP</option>
                        <option>SE</option>
                        <option>TO</option>
                    </select>
                </div>
            </div>
            <div class="botao">
                <div class="proximo">
                    <button onclick="cadastro()">Cadastrar</button>
                </div>
            </div>
</body>
<script>
    function mascaraCnpj() {
        input_cnpj.value = input_cnpj.value
            .replace(/\D/g, "")
            .slice(0, 14)
            .replace(/^(\d{2})(\d)/, "$1.$2")
            .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
            .replace(/\.(\d{3})(\d)/, ".$1/$2")
            .replace(/(\d{4})(\d)/, "$1-$2");
    }

    function mascaraCep() {
        input_cep.value = input_cep.value
            .replace(/\D/g, "")
            .slice(0, 8)
            .replace(/^(\d{5})(\d)/, "$1-$2");
    }


    function checar(valido, idMensagem, texto) {
        document.getElementById(idMensagem).innerHTML = valido
            ? ""
            : `<span style="color: red">*${texto}</span>`;
        return valido;
    }

    function cadastro() {
    const codigo = input_codigo.value.trim();
    const nome = input_nome.value.trim();
    const cnpj = input_cnpj.value.replace(/\D/g, "");
    const cep = input_cep.value.replace(/\D/g, "");
    const logradouro = input_rua.value.trim();
    const numero = input_numero.value.trim();
    const cidade = input_cidade.value.trim();
    const estado = input_estado.value;

    const resultados = [
        checar(codigo !== "", "mensagemcodigo", "Insira o código de acesso"),
        checar(nome.length >= 3, "mensagemnome", "Insira a razão social"),
        checar(cnpj.length === 14, "mensagemcnpj", "O CNPJ precisa ter 14 dígitos"),
        checar(cep.length === 8, "mensagemcep", "O CEP precisa ter 8 dígitos"),
        checar(logradouro.length >= 3, "mensagemrua", "Insira o logradouro"),
        checar(numero !== "", "mensagemnumero", "Insira o número"),
        checar(cidade.length >= 2, "mensagemcidade", "Insira a cidade"),
        checar(estado !== "", "mensagemestado", "Escolha o estado"),
    ];
    if (!resultados.every(Boolean)) return;

    fetch("/empresaAdmin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ codigo, nome, cnpj, cep, logradouro, numero, cidade, estado })
    })
            .then(async function (resposta) {
                if (resposta.ok) {
                    window.location.href = "./acessoEmpresa.html";
                } else {
                    checar(false, "mensagemcnpj", await resposta.text());
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
                checar(false, "mensagemcnpj", "Erro ao conectar com o servidor");
            });
    }
</script>

</html>
